[package]
name = "game"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "game_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Steamworks 集成
steamworks = "0.11"
once_cell = "1.19"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"

[profile.release]
strip = true
opt-level = 3
lto = true
